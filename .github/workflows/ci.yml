name: Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m

      - name: gcd verify (arm64e)
        run: |
          clang++ -arch arm64e -fobjc-arc -framework Foundation -framework CoreFoundation -ldl -o /tmp/gv_a64e gcd_verify_probe.mm
          echo "=== arm64e ==="
          /tmp/gv_a64e
        continue-on-error: true
