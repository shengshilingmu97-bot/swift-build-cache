name: Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m

      - name: typeinfo vtable probe (arm64e)
        run: |
          clang++ -arch arm64e -fobjc-arc -fcxx-exceptions -framework Foundation -framework Security -lc++abi -ldl -o /tmp/ti_a64e typeinfo_vtable_probe.mm
          echo "=== arm64e ==="
          /tmp/ti_a64e
        continue-on-error: true
