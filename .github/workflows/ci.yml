name: Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m

      - name: cache dispatch probe (arm64e)
        run: |
          clang++ -arch arm64e -fobjc-arc -fcxx-exceptions -framework Foundation -lobjc -ldl -o /tmp/cd_a64e cache_dispatch_probe.mm
          echo "=== arm64e ==="
          /tmp/cd_a64e
        continue-on-error: true
