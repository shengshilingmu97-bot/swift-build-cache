name: Build and Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m

      - name: runtime introspect (arm64e)
        run: |
          clang -arch arm64e -fobjc-arc -framework Foundation -framework Security -framework CoreFoundation -ldl -o /tmp/ri_a64e runtime_introspect.m
          echo "=== arm64e (PAC enforced) ==="
          /tmp/ri_a64e
        continue-on-error: true

      - name: exception bench (arm64e)
        run: |
          clang++ -arch arm64e -fobjc-arc -fcxx-exceptions -framework Foundation -lc++abi -ldl -o /tmp/exc_a64e exception_bench.mm
          echo "=== arm64e ==="
          /tmp/exc_a64e
        continue-on-error: true
