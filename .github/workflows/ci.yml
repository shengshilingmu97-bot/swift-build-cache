name: Build and Test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m
      - name: zone alignment check
        run: |
          clang -arch arm64e -framework CoreFoundation -o /tmp/zp zone_probe.m
          /tmp/zp
        continue-on-error: true
