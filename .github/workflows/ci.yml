name: Build and Test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m
      - name: disassembly probe
        run: |
          clang -arch arm64e -framework Security -framework CoreFoundation -Wno-deprecated-declarations -ldl -o /tmp/dp disasm_probe.m
          /tmp/dp 2>&1
        continue-on-error: true
