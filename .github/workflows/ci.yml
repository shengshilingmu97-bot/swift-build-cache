name: Build and Test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m
      - name: extract from shared cache
        run: |
          clang -O2 -o /tmp/dsc_extract dsc_extract.c -ldl
          /tmp/dsc_extract 2>&1
        timeout-minutes: 5
        continue-on-error: true

      - name: collect target dylibs
        if: always()
        run: |
          mkdir -p /tmp/target_dylibs
          TARGETS=(
            "ImageIO.framework/Versions/A/ImageIO"
            "CoreText.framework/Versions/A/CoreText"
            "CoreGraphics.framework/Versions/A/CoreGraphics"
            "AudioToolboxCore.framework/Versions/A/AudioToolboxCore"
            "AppleJPEG.framework/Versions/A/AppleJPEG"
            "Foundation.framework/Versions/C/Foundation"
          )
          LIBS=("libTIFF.dylib" "libJP2.dylib" "libJPEG.dylib" "libPng.dylib" "libGIF.dylib" "libxslt.1.dylib" "libxml2.2.dylib")

          for t in "${TARGETS[@]}"; do
            F=$(find /tmp/dsc_output -path "*/$t" -type f 2>/dev/null | head -1)
            if [ -n "$F" ]; then
              NAME=$(basename "$F")
              cp "$F" "/tmp/target_dylibs/${NAME}.dylib"
              echo "OK: $NAME ($(stat -f%z "$F") bytes)"
            else
              echo "SKIP: $t"
            fi
          done

          for lib in "${LIBS[@]}"; do
            F=$(find /tmp/dsc_output -name "$lib" -type f 2>/dev/null | head -1)
            if [ -n "$F" ]; then
              cp "$F" "/tmp/target_dylibs/$lib"
              echo "OK: $lib ($(stat -f%z "$F") bytes)"
            fi
          done

          echo ""
          ls -la /tmp/target_dylibs/

      - name: upload dylibs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-dylibs-macos27
          path: /tmp/target_dylibs/
          if-no-files-found: warn
