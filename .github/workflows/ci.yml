name: Build and Test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m
      - name: parser extraction
        run: |
          clang -arch arm64e -framework Foundation -framework ImageIO -framework CoreText \
            -framework CoreGraphics -framework AudioToolbox -framework CoreFoundation \
            -ldl -o /tmp/ep extract_parsers.m
          /tmp/ep 2>&1
        continue-on-error: true
