name: Build and Test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m
      - name: extract frameworks
        run: |
          clang -o /tmp/dsc_extract dsc_extract.c -ldl
          /tmp/dsc_extract 2>&1
        continue-on-error: true
        timeout-minutes: 5

      - name: upload frameworks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos27-frameworks
          path: |
            /tmp/dsc_frameworks/**/ImageIO
            /tmp/dsc_frameworks/**/CoreText
            /tmp/dsc_frameworks/**/CoreGraphics
            /tmp/dsc_frameworks/**/AudioToolboxCore
            /tmp/dsc_frameworks/**/AppleJPEG
            /tmp/dsc_frameworks/**/libTIFF.dylib
            /tmp/dsc_frameworks/**/libJP2.dylib
            /tmp/dsc_frameworks/**/libJPEG.dylib
            /tmp/dsc_frameworks/**/libPng.dylib
          if-no-files-found: warn
