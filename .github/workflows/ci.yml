name: Build and Test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sw_vers && uname -m
      - name: otool symbol analysis
        run: |
          chmod +x otool_analysis.sh
          bash otool_analysis.sh 2>&1
        continue-on-error: true
